# Pico-286 key presets for the R36SX native port.
# Values use labels such as A, ENTER, ESC, SPACE, CTRL, F1.
# Side-specific modifiers are LSHIFT, RSHIFT, LCTRL, RCTRL, LALT, RALT.
# Modifiers can be combined with '+': CTRL+S, SHIFT+A, CTRL+ALT+DEL.

active=Default

[preset Default]
up=UP
down=DOWN
left=LEFT
right=RIGHT
a=ENTER
b=ESC
y=CTRL
x=ESC
start=ENTER
select=SHIFT
l=TAB
l2=LCTRL
r=SHIFT
r2=LALT
