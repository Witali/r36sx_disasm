# Pico-286 configuration for the R36SX native port.
# Paths are relative to this directory unless an absolute path is used.
# Disk drive values are file names loaded from image_dir.

# CPU compatibility model: 8086, 80286, or 80386.
# Higher-generation instructions are accepted only when the selected
# model supports them; unsupported opcodes raise INT 6.
# cpu_mode=real is the normal PC boot mode. cpu_mode=protected is
# parsed for experiments; full protected-mode execution is still WIP.
# CPU speed knob is converted to exec86 instructions/sec using
# round historical throughput: 8086=75k, 80286=150k,
# 80386=300k instructions/sec per MHz.
# The disk menu edits cpu_mhz from 1 to 30 MHz in 1 MHz steps.
# x87_enabled=0 hides the math coprocessor from DOS probes.
[cpu]
cpu_model=80386
cpu_mode=real
cpu_mhz=33.0
x87_enabled=1

# Main loop timing. target_fps sets the frame budget used by
# adaptive exec86 quantum control and display pacing.
[timing]
target_fps=60

# Emulated BIOS RTC/CMOS clock.
# rtc_enabled disables both AT and XT RTC interfaces when 0.
# rtc_at_enabled controls AT CMOS ports 70h/71h.
# rtc_xt_enabled controls XT-compatible ports 240h..257h.
# RTC start time is local time.
# Format: YYYY-MM-DD HH:MM:SS.  If omitted, the built-in
# default is 2026-06-03 00:00:00.
[rtc]
rtc_enabled=1
rtc_at_enabled=1
rtc_xt_enabled=1
#rtc_start_time=2026-06-06 08:16:34

# Scaling filter used when the DOS image is resized.
# Supported scaling_filter values: nearest, bilinear.
# keyboard_mode=normal resizes the DOS image above the keyboard.
# keyboard_mode=overlay draws the keyboard over the DOS image.
[video]
scaling_filter=nearest
keyboard_mode=normal

# Emulated audio devices mixed into the output stream.
# The built-in PC speaker/beeper is always enabled.
# audio_sample_rate supports 44100 and 22050 Hz.
[audio]
audio_sample_rate=44100
audio_adlib=1
audio_sound_blaster=1
audio_cms=1
audio_sn76489=0
audio_mpu401=0
audio_disney=1
audio_covox=1

# Boot behavior and boot-sector probe order.
[boot]
boot_mode=normal
boot_order=hdd0,fdd0

# BIOS ROM provider: normal or test386.
# test_bios_rom is resolved relative to this config file.
[bios]
bios=normal
test_bios_rom=test386.bin

# Emulated memory sizes in KB, capped by the compiled buffers.
# total_memory_kb is distributed automatically unless an area below
# is explicitly written without a leading '#'.  Automatic layout maps
# conventional and upper/UMB inside the first 1 MB address space,
# then maps XMS/extended memory above the 1 MB boundary.
# Allowed ranges:
# total_memory_kb: 64..16384.
# conventional_kb: 64..640, reported through the BIOS Data Area.
# upper_kb: 0..176, limits XMS UMB allocations from D000:0000 upward.
# xms_kb: 0..15568, also backs linear physical RAM above 1 MB.
# extended_kb: 0..15568, reported by INT 15h AH=88h; defaults to xms_kb.
[memory]
total_memory_kb=8192
# conventional_kb=640
# upper_kb=176
# xms_kb=7168
# extended_kb=7168

# Screenshot output format: png or bmp.
# screenshot_build_hash=1 adds the first 8 hex digits of the
# embedded build commit-object SHA-256 to screenshot file names.
[screenshot]
screenshot_format=png
screenshot_build_hash=1

# Disk image I/O cache.
# disk_cache_buffer_kb is the stdio buffer allocated per image file.
# fflush runs after disk_cache_flush_sectors dirty sectors or after
# disk_cache_flush_ms milliseconds since the latest cached write.
[disk_cache]
disk_cache_buffer_kb=256
disk_cache_flush_sectors=16
disk_cache_flush_ms=2000

# Optional runtime profiling written to pico_286.log.
[profiling]
profiling_enabled=0
profiling_log_ms=10000

# Runtime debug log behavior.
# log_truncate_on_start=1 clears pico_286.log at process start.
# log_truncate_on_start=0 keeps append-only logs capped by build defaults.
# log_max_bytes limits pico_286.log growth; 0 disables the cap.
[debug]
log_truncate_on_start=0
log_max_bytes=2097152

# On-screen runtime statistics, toggled with Fn+D-pad Down.
[stats]
app_stats_enabled=1

# Compatibility hooks for DOS multiplex services.
# int2f_enabled=1 exposes built-in XMS discovery and the legacy host redirector.
# Set to 0 to let guest DOS/TSR handlers own INT 2Fh completely.
[compatibility]
int2f_enabled=1

# Host filesystem directory exposed to DOS by MAPDRIVE.COM.
# Relative paths are resolved next to pico_286.conf.
# MAPDRIVE.COM defaults to H: or accepts a drive parameter, e.g. MAPDRIVE G:.
# CONFIG.SYS needs LASTDRIVE set to the selected drive or higher.
[host_drive]
host_drive_path=host

# Directory that contains disk images used by short file names below.
# Relative paths are resolved next to pico_286.conf.
[disk_images]
image_dir=images

# BIOS floppy drives 00h and 01h, DOS A: and B:.
[floppy_drives]
fdd0=FreeDOS1.img
fdd1=sopwith.img

# BIOS hard drives 80h and 81h, DOS C: and D:.
[hard_drives]
hdd0=hdd.hdd
hdd0_geometry=65,16,63
hdd1=hdd2.hdd
hdd1_geometry=800,16,32
